<!doctype html>
<html lang="en-CA">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#081a2c">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="TruckLedger">
  <meta name="description" content="TruckLedger — Track every kilometre. Know every dollar. Offline mileage, expenses and earnings.">
  <link rel="manifest" href="./manifest.webmanifest?v=24">
  <link rel="icon" type="image/svg+xml" href="./icon.svg?v=24">
  <link rel="apple-touch-icon" sizes="192x192" href="./apple-touch-icon.png?v=24">
  <link rel="stylesheet" href="./style.css?v=24">
  <title>TruckLedger</title>
</head>
<body>
  <!-- Fast, nonblocking in-app splash (not an iOS system startup screen). -->
  <section id="launch-splash" aria-hidden="true">
    <div class="launch-fallback"><img src="./icon.svg?v=24" alt="" width="112" height="112"><strong>TruckLedger</strong><span>Track every kilometre. Know every dollar.</span></div>
    <img class="launch-art" src="./splash.webp?v=24" alt="" width="390" height="693" fetchpriority="high">
    <div class="launch-status"><span>LOADING YOUR LEDGER</span><i></i></div>
  </section>
  <div class="app">
    <header class="masthead">
      <div class="brandmark" aria-hidden="true"><img src="./icon.svg?v=24" width="42" height="42" alt=""></div>
      <div class="brand"><div class="name">TruckLedger</div><div class="brand-sub">Track every kilometre. Know every dollar.</div></div>
      <span id="offline-pill" class="pill">On-device</span>
    </header>

    <main id="content" tabindex="-1"></main>

    <nav class="tabbar" aria-label="Main navigation">
      <button data-nav="dashboard" class="active"><span class="nav-ico">◫</span><span>Overview</span></button>
      <button data-nav="trips"><span class="nav-ico">↗</span><span>Trips</span></button>
      <button data-nav="expenses"><span class="nav-ico">▤</span><span>Costs</span></button>
      <button data-nav="companies"><span class="nav-ico">▦</span><span>Clients</span></button>
      <button data-nav="investment" aria-label="Investment"><span class="nav-ico">◈</span><span>Invest</span></button>
      <button data-nav="data"><span class="nav-ico">⚙</span><span>Data</span></button>
    </nav>
  </div>

  <!-- Standalone iOS editor: normal document flow avoids native dialog focus bugs. -->
  <section id="editor-page" hidden aria-label="Edit record">
    <div class="editor-page-head">
      <button type="button" id="close-editor-page" class="editor-back" aria-label="Back without saving">‹ Back</button>
      <div id="editor-page-heading" class="editor-page-title"></div>
    </div>
    <div id="editor-page-content"></div>
  </section>

  <dialog id="editor" aria-label="Edit record">
    <div class="dialog-wrap">
      <div class="dialog-top"><div id="dialog-heading" class="dialog-title"></div><button type="button" id="close-dialog" class="icon-button" aria-label="Close">✕</button></div>
      <div id="dialog-content"></div>
    </div>
  </dialog>

  <section id="guide-overlay" hidden aria-label="TruckLedger getting started tutorial"></section>

  <div id="app-update-banner" role="status" aria-live="polite" hidden>
    <div class="app-update-icon" aria-hidden="true">↗</div>
    <div class="app-update-message" data-update-message>TruckLedger update ready.</div>
    <button type="button" class="app-update-action" data-app-reload>Refresh</button>
    <button type="button" class="app-update-close" data-app-update-dismiss aria-label="Dismiss update reminder">✕</button>
  </div>

  <div id="toast" role="status" aria-live="polite"></div>
  <script src="https://accounts.google.com/gsi/client" async></script>
  <script src="./cloud.js" defer></script>
  <script src="./audit_pdf.js?v=20" defer></script>
  <script src="./finances.js" defer></script>
  <script src="./trend.js?v=16" defer></script>
  <script src="./motion.js?v=24" defer></script>
  <script src="./auto_personal.js?v=18" defer></script>
  <script src="./tutorial.js?v=24" defer></script>
  <script src="./polish.js?v=23" defer></script>
  <script src="./splash.js?v=24" defer></script>
  <script src="./app.js?v=24" defer></script>
</body>
</html>
