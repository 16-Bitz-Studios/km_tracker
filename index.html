<!doctype html>
<html lang="en-CA">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0c1723">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="TruckLedger">
  <meta name="description" content="Offline-first work and personal mileage, company billing, fuel and maintenance tracking.">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" type="image/svg+xml" href="./icon.svg">
  <link rel="apple-touch-icon" href="./apple-touch-icon.png">
  <link rel="stylesheet" href="./style.css">
  <title>TruckLedger</title>
</head>
<body>
  <div class="app">
    <header class="masthead">
      <div class="brandmark" aria-hidden="true">↗</div>
      <div class="brand"><div class="name">TruckLedger</div><div class="brand-sub">Your mileage, your numbers.</div></div>
      <span id="offline-pill" class="pill">On-device</span>
    </header>

    <main id="content" tabindex="-1"></main>

    <nav class="tabbar" aria-label="Main navigation">
      <button data-nav="dashboard" class="active"><span class="nav-ico">◫</span><span>Overview</span></button>
      <button data-nav="trips"><span class="nav-ico">↗</span><span>Trips</span></button>
      <button data-nav="expenses"><span class="nav-ico">▤</span><span>Costs</span></button>
      <button data-nav="companies"><span class="nav-ico">▦</span><span>Clients</span></button>
      <button data-nav="investment" aria-label="Investment"><span class="nav-ico">◈</span><span>Invest</span></button>
      <button data-nav="data"><span class="nav-ico">⚙</span><span>Data</span></button>
    </nav>
  </div>

  <dialog id="editor" aria-label="Edit record">
    <div class="dialog-wrap">
      <div class="dialog-top"><div id="dialog-heading" class="dialog-title"></div><button type="button" id="close-dialog" class="icon-button" aria-label="Close">✕</button></div>
      <div id="dialog-content"></div>
    </div>
  </dialog>

  <div id="toast" role="status" aria-live="polite"></div>
  <script src="https://accounts.google.com/gsi/client" async></script>
  <script src="./cloud.js" defer></script>
  <script src="./audit_pdf.js" defer></script>
  <script src="./finances.js" defer></script>
  <script src="./app.js" defer></script>
</body>
</html>
